[workspace]
resolver = "2"
members = [
    "crates/sfm-core",
    "crates/sfm-io",
    "crates/sfm-features",
    "crates/sfm-geometry",
    "crates/sfm-match",
    "crates/sfm-ba",
    "crates/sfm-reconstruction",
    "crates/sfm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["sfmtory contributors"]

[workspace.dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
image = "0.25"
imageproc = "0.25"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
bincode = "1.3"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "tracing", "download-binaries", "tls-rustls", "cuda", "tensorrt"] }
ureq = "2"
dirs = "5"
sha2 = "0.10"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.31"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
