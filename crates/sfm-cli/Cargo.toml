[package]
name = "sfm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sfmtory"
path = "src/main.rs"

[features]
default = ["gui"]
# The viewer pulls in a windowing/GL stack, which is dead weight for headless
# use (CI, servers). Building with `--no-default-features` gives the plain CLI.
gui = ["dep:eframe", "dep:egui"]

[dependencies]
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
sfm-core = { path = "../sfm-core" }
sfm-io = { path = "../sfm-io" }
sfm-features = { path = "../sfm-features" }
sfm-match = { path = "../sfm-match" }
sfm-geometry = { path = "../sfm-geometry" }
sfm-reconstruction = { path = "../sfm-reconstruction" }
sfm-ba = { path = "../sfm-ba" }
nalgebra.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
rusqlite.workspace = true
bincode.workspace = true
rayon.workspace = true
image.workspace = true
imageproc.workspace = true
